name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
      # Masaüstü uygulamasının GTK/WebKit bağımlılıkları; pano testleri için gerçek X sunucusu (Xvfb) ve xclip.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev xvfb xclip
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - if: runner.os != 'Linux'
        run: cargo test --workspace
      - if: runner.os == 'Linux'
        run: xvfb-run -a cargo test --workspace
      # Gerçek cihaz testinde kullanılan teşhis aracı.
      - if: runner.os == 'Linux'
        run: cargo build --release -p oc
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: oc-linux
          path: target/release/oc

name: Release

# `v*` etiketi gönderilince macOS (universal) ve Windows paketlerini gerçek
# makinelerde derler, güncelleyici imzasıyla birlikte taslak Release'e koyar.
# Taslak kontrol edilip yayınlanınca uygulamalar `latest.json` üzerinden görür.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
          - platform: windows-latest
            rust_targets: ""
            args: --bundles nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: npx --yes @tauri-apps/cli@2
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: OpenContinuity ${{ github.ref_name }}
          releaseBody: |
            **macOS:** `.dmg` dosyasını indirin, uygulamayı Applications'a sürükleyin. İlk açılışta sağ tık → Aç.
            **Windows:** `-setup.exe` dosyasını indirip kurun. SmartScreen uyarısında "Ek bilgi → Yine de çalıştır".

            Kurulu uygulamalar yeni sürümü kendiliğinden bulur.
          releaseDraft: true
          includeUpdaterJson: true

name: Release

# `v*` etiketi (ya da elle tetikleme) macOS (universal) ve Windows paketlerini
# gerçek makinelerde derler, güncelleyici imzalarıyla birlikte iş akışı çıktısı
# olarak bırakır. Release'i `scripts/publish-release.sh` yükler ve yayınlar
# (bu depoda Actions token'ı Release oluşturamıyor: "Resource not accessible
# by integration").
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      notarize:
        description: "macOS paketi Apple noterliğinden geçsin (kapalıyken yalnız Developer ID imzası)"
        type: boolean
        default: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
            artifact: macos
            bundle_dir: target/universal-apple-darwin/release/bundle
          - platform: windows-latest
            rust_targets: ""
            args: --bundles nsis
            artifact: windows
            bundle_dir: target/release/bundle
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2

      # Noterlik için App Store Connect API anahtarı dosyaya yazılır.
      - if: runner.os == 'macOS'
        run: |
          echo "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}

      - uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS: Developer ID imzası + Apple noterliği (Windows'ta boş kalır).
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          # Noterlik bilgisi verilmezse tauri imzalar ama Apple'a göndermez.
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && inputs.notarize != false && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ runner.os == 'macOS' && inputs.notarize != false && secrets.APPLE_API_KEY || '' }}
        with:
          projectPath: apps/desktop
          tauriScript: npx --yes @tauri-apps/cli@2
          args: ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            ${{ matrix.bundle_dir }}/dmg/*.dmg
            ${{ matrix.bundle_dir }}/macos/*.app.tar.gz
            ${{ matrix.bundle_dir }}/macos/*.app.tar.gz.sig
            ${{ matrix.bundle_dir }}/nsis/*-setup.exe
            ${{ matrix.bundle_dir }}/nsis/*-setup.exe.sig

name: Release

# `v*` etiketi (ya da elle tetikleme) macOS (universal), Windows ve Linux paketlerini
# gerçek makinelerde derler, güncelleyici imzalarıyla birlikte iş akışı çıktısı
# olarak bırakır. Release'i `scripts/publish-release.sh` yükler ve yayınlar
# (bu depoda Actions token'ı Release oluşturamıyor: "Resource not accessible
# by integration").
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      notarize:
        description: "macOS paketi Apple noterliğinden geçsin (kapalıyken yalnız Developer ID imzası)"
        type: boolean
        default: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
            artifact: macos
            bundle_dir: target/universal-apple-darwin/release/bundle
          - platform: windows-latest
            rust_targets: ""
            args: --bundles nsis
            artifact: windows
            bundle_dir: target/release/bundle
          # 22.04: eski glibc'yle derlenen paket Linux Mint 21 (Ubuntu 22.04 tabanlı) ve sonrasında açılır.
          - platform: ubuntu-22.04
            rust_targets: ""
            args: --bundles deb,appimage
            artifact: linux
            bundle_dir: target/release/bundle
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2

      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      # Noterlik için App Store Connect API anahtarı. tauri boş değişkeni de
      # "tanımlı" sayıp noterliği denediği için noterlik kapalıyken hiç verilmez.
      - if: runner.os == 'macOS' && inputs.notarize != false
        run: |
          echo "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY=$APPLE_API_KEY" >> "$GITHUB_ENV"
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}

      - uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS: Developer ID imzası (Windows'ta boş kalır); noterlik yukarıdaki adımdan.
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
        with:
          projectPath: apps/desktop
          tauriScript: npx --yes @tauri-apps/cli@2
          args: ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            ${{ matrix.bundle_dir }}/dmg/*.dmg
            ${{ matrix.bundle_dir }}/macos/*.app.tar.gz
            ${{ matrix.bundle_dir }}/macos/*.app.tar.gz.sig
            ${{ matrix.bundle_dir }}/nsis/*-setup.exe
            ${{ matrix.bundle_dir }}/nsis/*-setup.exe.sig
            ${{ matrix.bundle_dir }}/deb/*.deb
            ${{ matrix.bundle_dir }}/deb/*.deb.sig
            ${{ matrix.bundle_dir }}/appimage/*.AppImage
            ${{ matrix.bundle_dir }}/appimage/*.AppImage.sig
